{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'library' %}<rect x="3" y="4" width="7" height="16" rx="2"/><path d="m14 4 5-1 3 16-5 1zM6 8h1m-1 8h1m9-9 2-.4"/>
{% elif name == 'explore' %}<circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5z"/>
{% elif name == 'spark' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>
{% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="16" cy="17" r="3" fill="currentColor"/>
{% elif name == 'profile' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% elif name == 'social' %}<circle cx="9" cy="8" r="3.5"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m1-17a3.5 3.5 0 0 1 0 7m2 3a6 6 0 0 1 3 5v2"/>
{% elif name == 'refresh' %}<path d="M20 7a9 9 0 0 0-15-2L2 8m0-5v5h5M4 17a9 9 0 0 0 15 2l3-3m0 5v-5h-5"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
{% elif name == 'edit' %}<path d="m15 4 5 5M4 20l5-1L20 8a3.5 3.5 0 0 0-5-5L4 14z"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'heart' %}<path d="M20.5 5.5a5 5 0 0 0-7 0L12 7l-1.5-1.5a5 5 0 0 0-7 7L12 21l8.5-8.5a5 5 0 0 0 0-7z"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'star' %}<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/>
{% elif name == 'film' %}<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4m-4 8h4m10-8h4m-4 8h4"/>
{% elif name == 'stats' %}<path d="M4 20V11m5 9V5m5 15v-7m5 7V8"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'cards' %}<rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/>
{% elif name == 'shelf' %}<path d="M4 4h3v15H4zM9 4h3v15H9z"/><path d="m14.5 4.2 2.9-.7 3.1 15-2.9.7zM2 20h20"/>
{% elif name == 'command' %}<path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
{% elif name == 'dial' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="m13.6 10.4 3.4-3.4M7 12H5m14 0h-2m-5-7V3"/>
{% elif name == 'ticket' %}<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M10 6v12" stroke-dasharray="2 2.5"/>
{% elif name == 'reel' %}<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="7.5" r="1.4"/><circle cx="12" cy="16.5" r="1.4"/><circle cx="7.5" cy="12" r="1.4"/><circle cx="16.5" cy="12" r="1.4"/><path d="M12 20.5H22"/>
{% elif name == 'sidebar' %}<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/>
{% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
{% elif name == 'eye' %}<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
{% elif name == 'grip' %}<circle cx="9" cy="6" r="1" fill="currentColor"/><circle cx="15" cy="6" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="18" r="1" fill="currentColor"/><circle cx="15" cy="18" r="1" fill="currentColor"/>
{% elif name == 'flame' %}<path d="M12 3c1.5 3.2 5 5.2 5 9.5a5 5 0 0 1-10 0c0-2.6 1.5-4.4 2.8-6 .4 1.5 1.4 2.2 2.2 2.2.3-1.9.1-3.9 0-5.7z"/>
{% elif name == 'award' %}<circle cx="12" cy="9" r="5.5"/><path d="m8.8 13.6-1.3 7.4L12 18.5l4.5 2.5-1.3-7.4"/>
{% elif name == 'chevron' %}<path d="m6 9 6 6 6-6"/>
{% endif %}
</svg>
{%- endmacro %}
