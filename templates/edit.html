{% extends "base.html" %}
{% block title %}
    Edit {{ movie.title }}
{% endblock %}
{% block content %}
    <div class="form-page">
        <a class="back-link" href="{{ next_url }}">← Back</a>
        <section class="form-card">
            <p class="eyebrow">YOUR PERSPECTIVE</p>
            <h1>{{ movie.title }}</h1>
            {% if error %}
                <p class="form-error" role="alert">{{ error }}</p>
            {% endif %}
            <form class="movie-form"
                  action="{{ url_for('edit',movie_id=movie.id,next=next_url) }}"
                  method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="rating">Your rating (1–10)</label>
                <input id="rating"
                       name="rating"
                       type="number"
                       min="1"
                       max="10"
                       value="{{ movie.rating or '' }}">
                <label for="watched_date">Watched date</label>
                <input id="watched_date"
                       name="watched_date"
                       type="date"
                       value="{{ movie.watched_date or '' }}">
                <label for="note">Your note</label>
                <textarea id="note" name="note" rows="7" maxlength="20000">{{ movie.note or '' }}</textarea>
                <button>Save changes</button>
                <a class="edit-link" href="{{ next_url }}">Cancel</a>
            </form>
            <div class="quick-actions" data-detail-id="{{ movie.id }}">{% include "_library_actions.html" %}</div>
        </section>
    </div>
{% endblock %}
