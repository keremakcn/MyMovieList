<div class="library-action" data-tmdb-id="{{ movie.tmdb_id }}" data-movie-title="{{ movie.title }}" {% if compact_movie_action %}data-compact="true"{% endif %}>
    {% if movie.library %}
        <a class="in-library" aria-label="{{ t("Edit {title} — {status}", title=movie.title, status=t('Watched' if movie.library.status == 'Watched' else 'In your library')) }}"
           href="{{ url_for('edit', movie_id=movie.library.id, next=current_url) }}">{{ t('✓ In your library' if compact_movie_action else '✓ Already in your library — Click to edit') }}</a>
    {% else %}
        <form action="/add_from_catalog" method="post" data-add-movie>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="movie_id" value="{{ movie.tmdb_id }}">
            <input type="hidden" name="next" value="{{ current_url }}">
            <button type="submit" aria-label="{{ t("Add {title} to Want to Watch", title=movie.title) }}">{{ t('+ Want to watch' if compact_movie_action else '+ Add to Want to Watch') }}</button>
        </form>
    {% endif %}
</div>
