<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add Movie</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

<body>
    <main class="form-page">
        <a class="back-link" href="/">← Back to Watchlist</a>

        <section class="form-card">
            <h1>Add Movie</h1>

            {% if error %}
                <p class="form-error">{{ error }}</p>
            {% endif %}

            <form class="movie-form" action="/add" method="post">
                <label for="title">Title</label>
                <input id="title" type="text" name="title" required>

                <label for="year">Year</label>
                <input id="year" type="number" name="year">

                <label for="genre">Genre</label>
                <input id="genre" type="text" name="genre">

                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Watchlist">Watchlist</option>
                    <option value="Watched">Watched</option>
                </select>

                <label for="rating">Rating (1–10)</label>
                <input id="rating" type="number" name="rating" min="1" max="10">

                <label for="note">Note</label>
                <textarea id="note" name="note" rows="5"></textarea>

                <button type="submit">Add Movie</button>
            </form>
        </section>
    </main>
</body>
</html>
