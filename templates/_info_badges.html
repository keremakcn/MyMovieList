<div class="info-badges">
    {% if movie.year %}
        <span class="info-badge">{{ movie.year }}</span>
    {% endif %}
    {% if movie.genre %}
        <span class="info-badge">{{ movie.genre }}</span>
    {% endif %}
    {% if tmdb.runtime %}
        <span class="info-badge">{{ tmdb.runtime }} min</span>
    {% endif %}
    {% if tmdb.score_percent is not none %}
        <span class="info-badge">TMDB {{ tmdb.score_percent }}%</span>
    {% endif %}
    <a class="info-badge info-badge-link"
       href="https://www.youtube.com/results?search_query={{ (movie.title ~ ' trailer')|urlencode }}"
       target="_blank"
       rel="noopener noreferrer">▶ Find trailer</a>
</div>
