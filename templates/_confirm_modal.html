{# Reusable confirmation modal, paired with script.js. Include once at
   the bottom of any page that has a form with data-confirm="...". #}
<div class="confirm-modal" id="confirm-modal">
    <div class="confirm-modal-box">
        <p class="confirm-modal-message">Are you sure?</p>
        <div class="confirm-modal-buttons">
            <button type="button" class="confirm-modal-cancel">Cancel</button>
            <button type="button" class="confirm-modal-confirm delete-button">Delete</button>
        </div>
    </div>
</div>
