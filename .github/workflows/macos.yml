name: macOS packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS beta (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-macos.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-macos.txt -r requirements-dev.txt
      - name: Validate source
        run: python -m pytest -q -p no:cacheprovider
      - name: Build and verify beta DMG
        run: python scripts/build_macos.py --arch "$BUILD_ARCH"
        env:
          BUILD_ARCH: ${{ matrix.arch }}
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: MyMovieList-macos-${{ matrix.arch }}-beta
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/macos/v*/*.dmg
            dist/macos/v*/*-SHA256SUMS.txt
            dist/macos/v*/*-verification.json
